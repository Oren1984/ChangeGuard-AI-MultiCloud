name: changeguard

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-changeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeguard}
      POSTGRES_DB: ${POSTGRES_DB:-changeguard}
    volumes:
      - changeguard_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-changeguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - changeguard-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      CHANGEGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeguard}:${POSTGRES_PASSWORD:-changeguard}@db:5432/${POSTGRES_DB:-changeguard}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - changeguard-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHANGEGUARD_ENVIRONMENT: ${CHANGEGUARD_ENVIRONMENT:-local}
      CHANGEGUARD_LOG_LEVEL: ${CHANGEGUARD_LOG_LEVEL:-INFO}
      CHANGEGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-changeguard}:${POSTGRES_PASSWORD:-changeguard}@db:5432/${POSTGRES_DB:-changeguard}
      CHANGEGUARD_AI_PROVIDER: ${CHANGEGUARD_AI_PROVIDER:-mock}
      CHANGEGUARD_AI_EXTERNAL_BASE_URL: ${CHANGEGUARD_AI_EXTERNAL_BASE_URL:-}
      CHANGEGUARD_AI_EXTERNAL_API_KEY: ${CHANGEGUARD_AI_EXTERNAL_API_KEY:-}
      CHANGEGUARD_CONFIDENCE_APPROVAL_THRESHOLD: ${CHANGEGUARD_CONFIDENCE_APPROVAL_THRESHOLD:-0.70}
      CHANGEGUARD_CONFIDENCE_HARD_FLOOR: ${CHANGEGUARD_CONFIDENCE_HARD_FLOOR:-0.35}
      CHANGEGUARD_ALLOW_CRITICAL_CAB_EXCEPTION: ${CHANGEGUARD_ALLOW_CRITICAL_CAB_EXCEPTION:-false}
      CHANGEGUARD_KILL_SWITCH_DEFAULT_ACTIVE: ${CHANGEGUARD_KILL_SWITCH_DEFAULT_ACTIVE:-false}
      CHANGEGUARD_MAX_PAYLOAD_BYTES: ${CHANGEGUARD_MAX_PAYLOAD_BYTES:-1000000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - changeguard-net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - changeguard-net
    profiles:
      - monitoring

networks:
  changeguard-net:
    driver: bridge

volumes:
  changeguard_db_data:
