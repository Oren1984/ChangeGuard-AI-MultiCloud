<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="870" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Evaluation pipeline and routing decision</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#475569">POST /api/v1/changes/{id}/evaluate. Router checks run top to bottom; the first match wins. The AI's own recommended route is never an input.</text>

  <!-- Pipeline column -->
  <g font-size="13" fill="#0f172a">
    <rect x="40" y="90" width="300" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="190" y="114" text-anchor="middle" font-weight="600">Change in state PROPOSED</text>
    <text x="190" y="134" text-anchor="middle" font-size="12" fill="#475569">via POST /changes or webhook intake</text>

    <rect x="40" y="176" width="300" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="190" y="200" text-anchor="middle" font-weight="600">1. Deterministic risk engine</text>
    <text x="190" y="219" text-anchor="middle" font-size="12" fill="#334155">16 rules, score capped at 100, level</text>
    <text x="190" y="235" text-anchor="middle" font-size="12" fill="#334155">any rule with severity 90+ = mandatory</text>

    <rect x="40" y="274" width="300" height="86" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="190" y="298" text-anchor="middle" font-weight="600">2. AI opinions (advisory only)</text>
    <text x="190" y="317" text-anchor="middle" font-size="12" fill="#334155">Primary: mock (or external if configured)</text>
    <text x="190" y="333" text-anchor="middle" font-size="12" fill="#334155">Secondary: mock in drift mode</text>
    <text x="190" y="349" text-anchor="middle" font-size="12" fill="#b91c1c">Primary unavailable: BLOCKED, HTTP 422</text>

    <rect x="40" y="388" width="300" height="104" rx="8" fill="#fef9c3" stroke="#eab308"/>
    <text x="190" y="412" text-anchor="middle" font-weight="600">3. Five assurance gates</text>
    <text x="190" y="431" text-anchor="middle" font-size="12" fill="#334155">Schema (fail) · Grounding (fail / warn)</text>
    <text x="190" y="447" text-anchor="middle" font-size="12" fill="#334155">Confidence: &lt;0.35 fail, &lt;0.70 warn</text>
    <text x="190" y="463" text-anchor="middle" font-size="12" fill="#334155">Safety blocklist (fail)</text>
    <text x="190" y="479" text-anchor="middle" font-size="12" fill="#334155">Consistency vs. second opinion (warn)</text>

    <rect x="40" y="520" width="300" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="190" y="544" text-anchor="middle" font-weight="600">4. Read kill-switch state</text>
    <text x="190" y="564" text-anchor="middle" font-size="12" fill="#475569">immediately before routing</text>
  </g>
  <line x1="190" y1="148" x2="190" y2="174" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="190" y1="246" x2="190" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="190" y1="360" x2="190" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="190" y1="492" x2="190" y2="518" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340,549 L380,549 L380,120 L418,120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="190" y="610" text-anchor="middle" font-size="11" fill="#64748b">Each step is persisted and appended to the</text>
  <text x="190" y="625" text-anchor="middle" font-size="11" fill="#64748b">SHA-256 hash-chained audit log.</text>

  <!-- Router column -->
  <rect x="420" y="80" width="460" height="560" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5. route_decision() (pure function)</text>

  <g font-size="12" fill="#0f172a">
    <rect x="440" y="118" width="300" height="70" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="138" font-weight="600">a. Mandatory rule hit or CRITICAL risk?</text>
    <text x="452" y="156" fill="#475569">Exception to CAB only if config allows it</text>
    <text x="452" y="173" fill="#475569">AND the change requests it (off by default)</text>

    <rect x="440" y="200" width="300" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="221" font-weight="600">b. Any assurance gate FAILED?</text>
    <text x="452" y="239" fill="#475569">fail closed</text>

    <rect x="440" y="262" width="300" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="283" font-weight="600">c. Risk level HIGH?</text>
    <text x="452" y="301" fill="#475569">score 50-79 with no mandatory rule</text>

    <rect x="440" y="324" width="300" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="345" font-weight="600">d. Any gate WARNING?</text>
    <text x="452" y="363" fill="#475569">low-ish confidence, no evidence, disagreement</text>

    <rect x="440" y="386" width="300" height="66" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="407" font-weight="600">e. Operational evidence missing?</text>
    <text x="452" y="425" fill="#475569">RISK-OPS-001 rollback, RISK-OPS-002 window,</text>
    <text x="452" y="441" fill="#475569">RISK-DB-003 schema change without rollback</text>

    <rect x="440" y="464" width="300" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="485" font-weight="600">f. Kill switch active?</text>
    <text x="452" y="503" fill="#475569">no auto-clear while active</text>

    <rect x="440" y="526" width="300" height="50" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="452" y="547" font-weight="600">g. Otherwise</text>
    <text x="452" y="565" fill="#475569">LOW/MEDIUM, gates passed, evidence present</text>
  </g>

  <!-- yes labels to decision chips -->
  <g font-size="11" font-weight="700">
    <rect x="760" y="138" width="104" height="28" rx="14" fill="#fee2e2" stroke="#dc2626"/>
    <text x="812" y="157" text-anchor="middle" fill="#991b1b">HARD_BLOCK</text>
    <rect x="760" y="211" width="104" height="28" rx="14" fill="#fee2e2" stroke="#dc2626"/>
    <text x="812" y="230" text-anchor="middle" fill="#991b1b">HARD_BLOCK</text>
    <rect x="760" y="273" width="104" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
    <text x="812" y="292" text-anchor="middle" fill="#92400e">CAB REVIEW</text>
    <rect x="760" y="335" width="104" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
    <text x="812" y="354" text-anchor="middle" fill="#92400e">CAB REVIEW</text>
    <rect x="760" y="405" width="104" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
    <text x="812" y="424" text-anchor="middle" fill="#92400e">CAB REVIEW</text>
    <rect x="760" y="475" width="104" height="28" rx="14" fill="#fef3c7" stroke="#d97706"/>
    <text x="812" y="494" text-anchor="middle" fill="#92400e">CAB REVIEW</text>
    <rect x="760" y="537" width="104" height="28" rx="14" fill="#dcfce7" stroke="#16a34a"/>
    <text x="812" y="556" text-anchor="middle" fill="#166534">AUTO_CLEAR</text>
  </g>
  <g stroke="#475569" stroke-width="1.2">
    <line x1="740" y1="152" x2="758" y2="152" marker-end="url(#a)"/>
    <line x1="740" y1="225" x2="758" y2="225" marker-end="url(#a)"/>
    <line x1="740" y1="287" x2="758" y2="287" marker-end="url(#a)"/>
    <line x1="740" y1="349" x2="758" y2="349" marker-end="url(#a)"/>
    <line x1="740" y1="419" x2="758" y2="419" marker-end="url(#a)"/>
    <line x1="740" y1="489" x2="758" y2="489" marker-end="url(#a)"/>
    <line x1="740" y1="551" x2="758" y2="551" marker-end="url(#a)"/>
    <line x1="590" y1="188" x2="590" y2="198" marker-end="url(#a)"/>
    <line x1="590" y1="250" x2="590" y2="260" marker-end="url(#a)"/>
    <line x1="590" y1="312" x2="590" y2="322" marker-end="url(#a)"/>
    <line x1="590" y1="374" x2="590" y2="384" marker-end="url(#a)"/>
    <line x1="590" y1="452" x2="590" y2="462" marker-end="url(#a)"/>
    <line x1="590" y1="514" x2="590" y2="524" marker-end="url(#a)"/>
  </g>
  <text x="749" y="146" font-size="10" fill="#475569" text-anchor="middle">yes</text>
  <text x="600" y="196" font-size="10" fill="#475569">no</text>
  <text x="440" y="600" font-size="11" fill="#64748b">Risk levels: score 0-24 LOW · 25-49 MEDIUM · 50-79 HIGH · 80+ CRITICAL</text>
  <text x="440" y="616" font-size="11" fill="#64748b">(a mandatory rule always makes the level CRITICAL)</text>

  <!-- Outcomes column -->
  <g font-size="13">
    <rect x="920" y="118" width="250" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1045" y="144" text-anchor="middle" font-weight="700" fill="#991b1b">BLOCKED</text>
    <text x="1045" y="164" text-anchor="middle" font-size="12" fill="#7f1d1d">terminal; AI cannot override</text>

    <rect x="920" y="290" width="250" height="88" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="1045" y="316" text-anchor="middle" font-weight="700" fill="#92400e">CAB_REVIEW_REQUIRED</text>
    <text x="1045" y="336" text-anchor="middle" font-size="12" fill="#78350f">CAB ticket + executive brief</text>
    <text x="1045" y="353" text-anchor="middle" font-size="12" fill="#78350f">approver / security_reviewer / admin;</text>
    <text x="1045" y="369" text-anchor="middle" font-size="12" fill="#78350f">never the submitter (403)</text>

    <rect x="920" y="520" width="250" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1045" y="546" text-anchor="middle" font-weight="700" fill="#166534">READY_TO_SHIP</text>
    <text x="1045" y="566" text-anchor="middle" font-size="12" fill="#14532d">terminal; nothing is deployed</text>
  </g>
  <g stroke="#475569" stroke-width="1.4" fill="none">
    <path d="M864,152 L918,150" marker-end="url(#a)"/>
    <path d="M864,225 L890,225 L890,170 L918,170" marker-end="url(#a)"/>
    <path d="M864,287 L890,287 L890,334 L918,334"/>
    <path d="M864,349 L890,349"/>
    <path d="M864,419 L890,419 L890,334"/>
    <path d="M864,489 L890,489 L890,419"/>
    <path d="M864,551 L918,551" marker-end="url(#a)"/>
    <path d="M1045,290 L1045,184" stroke="#dc2626" marker-end="url(#a)"/>
    <path d="M1045,378 L1045,518" stroke="#16a34a" marker-end="url(#a)"/>
  </g>
  <line x1="890" y1="334" x2="918" y2="334" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="1055" y="240" font-size="12" fill="#991b1b">reject</text>
  <text x="1055" y="452" font-size="12" fill="#166534">approve</text>

  <!-- Legend / notes -->
  <g transform="translate(0,-110)">
  <rect x="40" y="770" width="1130" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="796" font-size="14" font-weight="700" fill="#0f172a">Verified outcomes from the 14 demo fixtures (local run, mock AI provider)</text>
  <g font-size="12" fill="#334155">
    <text x="60" y="822">AUTO_CLEAR: 01 low-risk app change</text>
    <text x="60" y="842">HARD_BLOCK by rule (a): 03 public 0.0.0.0/0, 04 prod DB delete, 05 IAM wildcard, 06 DROP TABLE</text>
    <text x="60" y="862">HARD_BLOCK by gate failure (b): 08 fabricated evidence, 09 confidence 0.15, 10 "terraform destroy" advice</text>
    <text x="60" y="882">CAB by HIGH risk (c): 07 and 14 breaking API change · by gate warning (d): 02 confidence 0.55, 11 inconsistent opinions</text>
    <text x="60" y="902">CAB by kill switch (f): 12 otherwise auto-clearing change · 13 webhook replay is idempotent (201 then 200), not evaluated</text>
    <text x="60" y="922">State transitions are checked against an explicit allow-list; anything else returns HTTP 409.</text>
    <text x="60" y="942">CAB_APPROVED and CAB_REJECTED are recorded as intermediate states before READY_TO_SHIP / BLOCKED.</text>
  </g>
  </g>
</svg>
